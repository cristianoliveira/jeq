version: "2"

linters:
  default: standard
  enable:
    - depguard
    - revive
  settings:
    depguard:
      rules:
        # ADR 0002: domain -> standard library only (production files).
        domain-stdlib-only:
          files:
            - "**/internal/domain/**"
            - "!**/*_test.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/cristianoliveira/jeq/internal/domain
        # Domain test files may use shared fixtures and Testify assertions; production stays stdlib-only.
        domain-tests-fixtures-allowed:
          files:
            - "**/internal/domain/**/*_test.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/cristianoliveira/jeq/internal/domain
            - github.com/cristianoliveira/jeq/internal/fixtures
            - github.com/stretchr/testify/assert
            - github.com/stretchr/testify/require
        # ADR 0002: infra -> domain; never cli or cmd.
        infra-never-cli-or-main:
          files:
            - "**/internal/infra/**"
          deny:
            - pkg: github.com/cristianoliveira/jeq/internal/cli
              desc: infra must not depend on cli (ADR 0002)
            - pkg: github.com/cristianoliveira/jeq/cmd
              desc: infra must not depend on cmd (ADR 0002)
        # ADR 0002: cli -> domain; infra is injected by main through ports.
        cli-never-infra-or-main:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/cristianoliveira/jeq/internal/infra
              desc: cli depends on domain ports; infra is injected by main (ADR 0002)
            - pkg: github.com/cristianoliveira/jeq/cmd
              desc: no package imports cmd (ADR 0002)
        # ADR 0002: main -> cli + infra only.
        main-wires-cli-and-infra:
          files:
            - "**/cmd/**"
            - "!**/*_test.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/cristianoliveira/jeq/internal/cli
            - github.com/cristianoliveira/jeq/internal/infra
        # Command tests may use Testify without weakening production wiring rules.
        main-tests-testify-allowed:
          files:
            - "**/cmd/**/*_test.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/cristianoliveira/jeq/internal/cli
            - github.com/cristianoliveira/jeq/internal/infra
            - github.com/stretchr/testify/assert
            - github.com/stretchr/testify/require
        # ADR 0002: no package imports the composition root.
        nobody-imports-main:
          files:
            - $all
          deny:
            - pkg: github.com/cristianoliveira/jeq/cmd
              desc: no package imports cmd/jeq (ADR 0002)

formatters:
  enable:
    - gofumpt

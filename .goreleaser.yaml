version: 2

project_name: jeq
before:
  hooks:
    - go mod verify
builds:
  - id: jeq
    main: ./cmd/jeq
    binary: jeq
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/cristianoliveira/jeq/internal/cli.Version={{.Version}} -X github.com/cristianoliveira/jeq/internal/cli.Commit={{.Commit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - id: jeq
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
checksum:
  name_template: "checksums.txt"
changelog:
  use: github-native
release:
  prerelease: auto
  draft: false
snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Forma stays</title>
    <style>
      body { background: #f4f1e8; color: #26372a; font: 16px system-ui; margin: 0; }
      main { margin: 48px auto; max-width: 720px; padding: 32px; background: #fff; border-radius: 12px; }
      h1 { font: 42px Georgia, serif; margin-top: 0; }
      form, .filters { display: flex; gap: 16px; margin: 24px 0; align-items: end; }
      label { display: grid; gap: 6px; }
      input, select, button { font: inherit; padding: 10px 14px; }
      button { background: #31523a; border: 0; border-radius: 5px; color: white; cursor: pointer; }
      article { border-top: 1px solid #ccd4c7; margin-top: 28px; padding-top: 24px; }
      .proof { background: #edf3e8; border-radius: 6px; line-height: 1.8; padding: 16px; }
    </style>
  </head>
  <body>
    <main id="app">
      <p>CURATED, NOT CROWDED</p>
      <h1>Find a place to slow down.</h1>
      <form id="search">
        <label>Destination <input type="search" aria-label="Destination" required></label>
        <button type="submit">Find stays</button>
      </form>
      <div class="filters">
        <label>Category
          <select aria-label="Stay category">
            <option>All stays</option>
            <option>Design</option>
            <option>Nature</option>
          </select>
        </label>
        <label><input type="checkbox" aria-label="Free cancellation"> Free cancellation</label>
      </div>
      <section id="results" aria-live="polite">Set the requested filters, then find stays.</section>
    </main>
    <script>
      const app = document.querySelector('#app');
      const form = document.querySelector('#search');
      const destination = document.querySelector('[aria-label="Destination"]');
      const category = document.querySelector('[aria-label="Stay category"]');
      const cancellation = document.querySelector('[aria-label="Free cancellation"]');
      const results = document.querySelector('#results');

      form.addEventListener('submit', event => {
        event.preventDefault();
        const matches = destination.value.trim().toLowerCase() === 'lisbon'
          && category.value === 'Design'
          && cancellation.checked;
        results.innerHTML = matches
          ? '<article><p>LISBON · DESIGN</p><h2>Casa Flora</h2><p>Free cancellation · 2 guests</p><button type="button" id="open-stay">View Casa Flora</button></article>'
          : '<p>No stay matches every selected filter.</p>';
        document.querySelector('#open-stay')?.addEventListener('click', showDetail);
      });

      function showDetail() {
        location.hash = 'casa-flora';
        document.title = 'Casa Flora · Forma';
        app.innerHTML = `
          <p>LISBON · DESIGN</p>
          <h1>Casa Flora</h1>
          <p>A quiet courtyard, warm terracotta, and light that stays all afternoon.</p>
          <div class="proof">
            <div>Selected stay: Casa Flora</div>
            <div>Destination: Lisbon</div>
            <div>Category: Design</div>
            <div>Free cancellation: enabled</div>
          </div>`;
      }
    </script>
  </body>
</html>
